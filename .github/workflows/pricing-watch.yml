name: pricing watch

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare against the pricing feed
        id: check
        run: |
          node scripts/check-pricing.mjs
          if [ -f pricing-diff.md ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open a pull request with the diff
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="pricing/$(date -u +%Y-%m-%d)"
          git config user.name "pricing watch"
          git config user.email "actions@github.com"
          git checkout -B "$BRANCH"
          git add models.json
          git commit -m "prices: drift against the LiteLLM feed"
          git push -u --force-with-lease origin "$BRANCH"

          # Opening the PR needs the repo's "Allow GitHub Actions to create and
          # approve pull requests" setting, which is off by default and silently
          # outranks the pull-requests: write permission above. If it is ever
          # switched back off, fall back to an issue so a price move can't sit
          # unnoticed on a branch nobody looks at.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already open for $BRANCH"
          elif ! gh pr create \
              --title "Price drift, $(date -u +%Y-%m-%d)" \
              --body-file pricing-diff.md \
              --base main --head "$BRANCH"; then
            echo "::warning::Could not open a PR. Check Settings > Actions > General > Workflow permissions."
            gh issue create \
              --title "Price drift, $(date -u +%Y-%m-%d) (PR blocked)" \
              --body-file pricing-diff.md
            exit 1
          fi
